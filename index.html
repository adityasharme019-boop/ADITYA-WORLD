
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADITYA WORLD</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #172554, #050816 65%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

.container {
  width: 90%;
  max-width: 750px;
  padding: 40px 20px;
}

.orb {
  width: 150px;
  height: 150px;
  margin: 0 auto 35px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00e5ff, #7c3aed, #ff00aa);
  box-shadow: 0 0 35px #00d9ff, 0 0 90px #7c3aed;
  animation: float 4s ease-in-out infinite, glow 3s infinite alternate;
}

h1 {
  font-size: clamp(35px, 8vw, 65px);
  letter-spacing: 3px;
  margin-bottom: 18px;
  text-shadow: 0 0 20px #00d9ff;
}

p {
  font-size: 19px;
  color: #cbd5e1;
  margin-bottom: 35px;
}

.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
}

.btn {
  display: inline-block;
  text-decoration: none;
  color: white;
  padding: 16px 28px;
  border-radius: 40px;
  font-size: 17px;
  font-weight: bold;
  transition: 0.3s;
}

.youtube {
  background: #ff0033;
  box-shadow: 0 0 20px #ff0033;
}

.instagram {
  background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  box-shadow: 0 0 20px #d62976;
}

.btn:hover {
  transform: translateY(-6px) scale(1.05);
}

footer {
  margin-top: 55px;
  color: #64748b;
  font-size: 13px;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-18px); }
}

@keyframes glow {
  from { filter: brightness(0.9); }
  to { filter: brightness(1.3); }
}
</style>
</head>

<body>
<div class="container">

  <div class="orb"></div>

  <h1>ADITYA WORLD</h1>

  <p>Hello, welcome to my website, my friends! 🌍</p>

  <div class="buttons">
    <a class="btn youtube"
       href="https://youtube.com/@aditya_gamer_7071"
       target="_blank"
       rel="noopener noreferrer">
       ▶ Visit My YouTube
    </a>

    <a class="btn instagram"
       href="https://www.instagram.com/adityagamer7071?cnvx=MW5kMzd4YzUxMGt6Mw=="
       target="_blank"
       rel="noopener noreferrer">
       ◎ Follow My Instagram
    </a>
  </div>

  <footer>© 2026 ADITYA WORLD | Made by Aditya</footer>

</div>
</body>
</html>
